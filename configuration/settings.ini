[models]
towerinstruct   = Unbabel/TowerInstruct-Mistral-7B-v0.2
towerplus       = Unbabel/Tower-Plus-9B

[seedbench]
path            = benchmarks/Seedbench.json
format          = json
question_key    = question
answers_keys    = choice_a|choice_b|choice_c|choice_d
filter_by       = image
prompt_path     = configuration/prompts/seedbench_prompt.txt

[llava_coco]
path            = benchmarks/llavabench_coco_noimg.parquet
format          = parquet
separated       = true
question_key    = question
answer_key      = answer
caption_key     = caption
prompt_path     = configuration/prompts/simple_prompt.txt

[llava_wild]
path            = benchmarks/llavabench_coco_noimg.parquet
format          = parquet
separated       = true
question_key    = question
answer_key      = answer_gpt
caption_key     = caption
prompt_path     = configuration/prompts/simple_prompt.txt

[mmbench]
path            = benchmarks/mmbench_test_en_20231003_no_image.tsv
format          = tsv
question_key    = question
answers_keys    = A|B|C|D
q_only_content  = code
prompt_path     = configuration/prompts/simple_prompt.txt

[aokvqa_val]
path            = benchmarks/aokvqa_v1p0_val.json
format          = json
question_key    = question
answers_keys    = choices
prompt_path     = configuration/prompts/simple_prompt.txt
separated       = true
rationales      = rationales
dir_answers_key = direct_answers

[aokvqa_test]
path            = benchmarks/aokvqa_v1p0_test.json
format          = json
question_key    = question
answers_keys    = choices
prompt_path     = configuration/prompts/simple_prompt.txt

[vqav2_test]
path            = benchmarks/v2_OpenEnded_mscoco_test2015_questions.json
format          = json
question_key    = question
benchmark_key   = questions
prompt_path     = configuration/prompts/simple_prompt.txt

[vqav2_val]
path            = benchmarks/vqav2_val.json
annotation_path = benchmarks/vqav2_annotations.json
format          = json
question_key    = question
benchmark_key   = questions
answers_key     = answers
sep_ans_key     = answer
annotation_key  = annotations
prompt_path     = configuration/prompts/simple_prompt.txt

[hallusionbench]
path            = benchmarks/HallusionBench.json
format          = json
question_key    = question
separated       = true
details_key     = gt_answer_details
prompt_path     = configuration/prompts/simple_prompt.txt

